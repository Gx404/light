name: Validate and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check JavaScript and behavior
        run: |
          node --check dist/app.js
          node --check dist/site.config.js
          node --check dist/vendor/fluid.js
          node --test tests/*.test.cjs

      - name: Build and smoke-test standalone container
        run: |
          docker build -t light:test .
          docker run -d --name light-smoke -p 127.0.0.1:18080:80 light:test
          trap 'docker logs light-smoke; docker rm -f light-smoke' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors --max-time 5 --output /tmp/light-health http://127.0.0.1:18080/healthz
          grep -qx 'ok' /tmp/light-health
          curl --fail --silent --show-error --output /tmp/light-home http://127.0.0.1:18080/
          grep -q '<title>Light' /tmp/light-home
          curl --fail --silent --show-error -I --output /tmp/light-headers http://127.0.0.1:18080/site.config.js
          grep -qi 'cache-control: no-cache' /tmp/light-headers

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

